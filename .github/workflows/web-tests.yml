name: Sitio Ahorro Real
on:
  pull_request:
    paths: ['web/**', 'tests/test_web.py', '.github/workflows/web-tests.yml']
  push:
    branches: [master]
    paths: ['web/**', 'tests/test_web.py', '.github/workflows/web-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest==9.1.1
      - run: python -m pytest -q tests/test_web.py
      - run: python web/build.py

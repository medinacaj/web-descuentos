name: recolección fase 1 (muestra)

# Corre bajo demanda o al cambiar el recolector. No envía correos ni escribe en la base de datos.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "ids separados por coma (vacío = falabella, hites, lider)"
        required: false
        default: ""
  push:
    paths: [scrapers/retail/**, tools/collect.py, .github/workflows/collect.yml]

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_collect.py
      - name: Recolectar
        run: python -m tools.collect ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: collected
          path: reports/collected.json
          retention-days: 7

name: Verificar muestras de precios
on:
  pull_request:
  push:
    branches: [master]
    paths: ['core/**','tests/**','tools/phase1.py','.github/workflows/phase1-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_phase1 -v

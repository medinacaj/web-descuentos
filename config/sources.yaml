# Registro de fuentes. Es un catálogo vivo: en fase 3 el sistema agrega fuentes nuevas con discovered_by: auto.
#
# readable: ok | partial | blocked | unknown   (lo completa tools/recon.py; NO se edita a mano)
# trust_rank: 1 tienda oficial · 2 banco/emisor oficial · 3 app oficial · 4 TyC · 5 distribuidor autorizado
#             6 marketplace · 7 comparador · 8 medio · 9 agregador/comunidad
# only_hints: true => lo que salga de aquí nunca queda "confirmado".
# probes: URLs que usa la fase 0 para probar lectura. Las rutas de promociones son candidatas;
#         si una devuelve 404 se corrige tras el reconocimiento.

defaults:
  sample_query: "iphone 15 pro 256gb"

sources:
  # ---------------------------------------------------------------- retail
  - id: falabella
    name: Falabella
    kind: retail
    base_url: https://www.falabella.com/falabella-cl
    frequency: daily
    trust_rank: 1        # tienda; su marketplace (Falabella.com vendedores externos) es rank 6
    readable: partial
    readable_cause: "product: HTML estático; promos: la página carga pero no se detectan precios/beneficios"
    probes:
      product: https://www.falabella.com/falabella-cl/search?Ntt=iphone+15+pro+256gb
      promos: https://www.falabella.com/falabella-cl/page/ofertas-falabella

  - id: paris
    name: Paris
    kind: retail
    base_url: https://www.paris.cl
    frequency: daily
    trust_rank: 1
    readable: blocked
    readable_cause: "product: bloqueo/WAF (http_403); promos: bloqueo/WAF (http_403)"
    probes:
      product: https://www.paris.cl/search/?q=iphone+15+pro+256gb
      promos: https://www.paris.cl/ofertas/

  - id: ripley
    name: Ripley
    kind: retail
